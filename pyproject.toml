[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "monte-carlo-options"
version = "0.19.0"
description = "Reproducible derivatives pricing, model comparison, and portfolio risk research"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anyio>=3.7,<4",
    "fastapi>=0.115,<0.116",
    "numpy>=2.0,<2.3",
    "pydantic>=2.9,<3",
    "scipy>=1.13,<2",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "mypy>=1.11,<2",
    "pytest>=8.3,<9",
    "ruff>=0.7,<1",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
addopts = "-m 'not performance'"
markers = ["performance: opt-in resource-intensive performance checks"]
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["backend/app"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "scipy.*"
ignore_missing_imports = true
